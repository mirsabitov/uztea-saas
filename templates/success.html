{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    {% include 'partials/google_analytics.html' %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful - UzTEA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-light: #4A6CF7;
            --primary-dark: #1E2845;
            --success-color: #10B981;
            --text-main: #334155;
            --text-muted: #64748B;
            --bg-light: #F8FAFC;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .success-card {
            background-color: white;
            max-width: 500px;
            width: 100%;
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(30, 40, 69, 0.08);
            text-align: center;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-logo img {
            max-width: 120px;
            margin-bottom: 20px;
        }

        .status-icon {
            width: 80px;
            height: 80px;
            background-color: #ECFDF5;
            color: var(--success-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 24px;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            color: var(--primary-dark);
            font-size: 28px;
            margin-bottom: 12px;
        }

        p {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 32px;
            font-size: 16px;
        }

        .btn {
            display: inline-block;
            background-color: var(--primary-light);
            color: white;
            padding: 14px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(74, 108, 247, 0.2);
        }

        .btn:hover {
            background-color: #3b5bdb;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(74, 108, 247, 0.3);
        }

        .confetti {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="success-card">
        <div class="header-logo">
            <img src="{% static 'images/logo.png' %}" alt="UzTEA Logo">
        </div>
        <div class="status-icon">✓</div>
        <h1>Congratulations!</h1>
        <p>Your application has been successfully submitted. <br>Welcome to the UzTEA community! We will contact you soon.</p>
        <a href="{% url 'membership_form' %}" class="btn">Back to Home</a>
    </div>
</body>
</html>
